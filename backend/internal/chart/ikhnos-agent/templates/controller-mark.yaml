{{- if (dig "controller" "resource" "" .Values.AsMap) }}
{{- /*
  controller.resource: this agent is kept by a controller, from the IkhnosAgent of that name. When the server revokes the agent it
  writes status.revoked on that resource, and the controller removes the agent, its identity with it. That is all this gives the agent:
  the right to patch the status subresource of that one object, which the API server does not let change its spec (so not the server it
  trusts, the image, the access tier or where telemetry goes). It cannot list resources of that kind, or delete the object, and it can read
  the status (what the controller says of a telemetry request) only when controller.relayTelemetry is on.
  Set by the controller when it installs the chart; a person installing the chart with Helm leaves it empty and gets nothing here.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.name" . }}-mark-revoked
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ikhnos.io"]
    resources: ["ikhnosagents/status"]
    resourceNames: [{{ .Values.controller.resource | quote }}]
    verbs: {{ if (dig "controller" "relayTelemetry" false .Values.AsMap) }}["get", "patch"]{{ else }}["patch"]{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.name" . }}-mark-revoked
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.name" . }}-mark-revoked}
subjects:
  - {kind: ServiceAccount, name: {{ include "agent.name" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
