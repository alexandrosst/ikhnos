{{- if (dig "controller" "resource" "" .Values.AsMap) }}
{{- /*
  controller.resource: this agent is kept by a controller, from the IkhnosAgent of that name. When the server revokes the agent it
  marks that resource (an annotation), and the controller removes the agent, its identity with it. That is all this gives the agent:
  the right to patch that one object. It cannot read it, list resources of that kind, change anything else, or delete the object.
  Set by the controller when it installs the chart; a person installing the chart with Helm leaves it empty and gets nothing here.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.name" . }}-mark-revoked
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ikhnos.io"]
    resources: ["ikhnosagents"]
    resourceNames: [{{ .Values.controller.resource | quote }}]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.name" . }}-mark-revoked
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.name" . }}-mark-revoked}
subjects:
  - {kind: ServiceAccount, name: {{ include "agent.name" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
