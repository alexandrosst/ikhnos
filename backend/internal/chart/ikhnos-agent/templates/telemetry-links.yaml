{{- if .Values.telemetry.clusterLinks.metrics.enabled }}
# The link metrics (telemetry.clusterLinks): Prometheus text on port 9104, scraped by the cluster collector, with the prober's and the responders'
# signed requests beside it. Its own Service (not ikhnos-agent-probe, which exists only with the node probe or flow collector) so that the
# collector's scrape target does not depend on how those are installed. It selects the agent, or with telemetry.clusterLinks.hub the hub, and keeps
# its name either way, so switching changes no address anyone is configured with.
apiVersion: v1
kind: Service
metadata:
  name: ikhnos-agent-link-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ include "agent.linkServerName" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: link-metrics, port: 9104, targetPort: link-metrics, protocol: TCP}
{{- end }}
