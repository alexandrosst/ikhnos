<svg viewBox="0 0 960 732" role="img" aria-label="Ikhnos has a control plane and a data plane. In the control plane, the server holds the observability intent, which says what to observe, where and how well, and the topology and history. The intent goes down to a discovery agent in each cloud, edge and far-edge cluster, and the topology comes back up. In the data plane, each cluster has a local operator with telemetry extractors and an OpenTelemetry collector. Telemetry goes through regional operators to FUSION&#x27;s central operator, then into Prometheus for metrics, Loki for logs and Tempo for traces. FUSION also holds the topology graph in Neo4j, and a shared API gives models, tools and people the fused data." font-size="14.95" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="obsplanes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7682"></path></marker><marker id="obsplanes-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker></defs><text x="24" y="34.5" font-size="17.25" font-weight="600" fill="#1f2328">Inside Ikhnos: control plane and data plane</text><text x="24" y="55.199999999999996" font-size="13.225" fill="#5b6672">The observability intent goes down to the agents. Telemetry goes up to FUSION.</text><rect x="24" y="76" width="912" height="112" rx="14" fill="#2563eb" fill-opacity="0.055" stroke="#2563eb" stroke-opacity="0.35"></rect><text x="48" y="102" font-size="13.225" font-weight="600" fill="#2563eb">CONTROL PLANE · IKHNOS SERVER</text><g><rect x="48" y="114" width="460" height="56" rx="10" fill="#2563eb" fill-opacity="0.14" stroke="#c2410c" stroke-width="2"></rect><circle cx="73" cy="139" r="15" fill="#2563eb" fill-opacity="0.16"></circle><g transform="translate(73 139)"><path d="M-6.5 -9.5H2L7 -4.5V9.5H-6.5Z" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2 -9.5V-4.5H7M-3 0H3.5M-3 3.5H3.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="97" y="136" font-weight="600" fill="#1f2328">Observability intent</text><text x="97" y="152" font-size="13.225" fill="#5b6672">what to observe, where, and how well</text></g><g><rect x="580" y="114" width="332" height="56" rx="10" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.5"></rect><circle cx="605" cy="139" r="15" fill="#2563eb" fill-opacity="0.16"></circle><g transform="translate(605 139)"><rect x="-8" y="-9" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="-8" y="-2.75" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="-8" y="3.5" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><path d="M-4.5 -6.2h.01M-4.5 0h.01M-4.5 6.2h.01" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="629" y="136" font-weight="600" fill="#1f2328">Topology &amp; history</text><text x="629" y="152" font-size="13.225" fill="#5b6672">what ran where, and when</text></g><rect x="24" y="216" width="912" height="474" rx="14" fill="#047857" fill-opacity="0.045" stroke="#047857" stroke-opacity="0.35"></rect><text x="48" y="242" font-size="13.225" font-weight="600" fill="#047857">DATA PLANE</text><text x="150" y="242" font-size="13.225" fill="#5b6672">metrics · logs · traces</text><g><rect x="48" y="248" width="332" height="124" rx="10" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"></rect><g><rect x="64" y="260" width="70" height="20" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.25"></rect><text x="99" y="274" text-anchor="middle" font-size="12.649999999999999" font-weight="600" fill="#1f2328">Cloud</text></g><rect x="300" y="262" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="324" y="262" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="348" y="262" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="64" y="294" width="128" height="64" rx="9" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.75"></rect><text x="128" y="322" font-weight="600" fill="#1f2328" text-anchor="middle">Discovery</text><text x="128" y="342" font-weight="600" fill="#1f2328" text-anchor="middle">agent</text><rect x="216" y="294" width="148" height="64" rx="9" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-width="1.75"></rect><text x="290" y="318" font-weight="600" fill="#1f2328" text-anchor="middle">Local operator</text><text x="290" y="336" font-size="13.225" fill="#5b6672" text-anchor="middle">telemetry extractors</text><text x="290" y="351" font-size="13.225" fill="#5b6672" text-anchor="middle">+ OTel collector</text><path d="M32 326H64" fill="none" stroke="#c2410c" stroke-width="1.75" marker-end="url(#obsplanes-arrow-accent)" marker-start="url(#obsplanes-arrow-accent)"></path><path d="M364 326H412V380H452" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#obsplanes-arrow)"></path></g><g><rect x="48" y="392" width="332" height="124" rx="10" fill="#047857" fill-opacity="0.06" stroke="#047857" stroke-width="1.5"></rect><g><rect x="64" y="404" width="62" height="20" rx="10" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="1.25"></rect><text x="95" y="418" text-anchor="middle" font-size="12.649999999999999" font-weight="600" fill="#1f2328">Edge</text></g><rect x="300" y="406" width="16" height="16" rx="3" fill="#a16207