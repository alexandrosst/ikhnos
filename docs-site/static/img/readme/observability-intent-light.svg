acity="0.1" stroke="#2563eb" stroke-width="1.75"></rect><text x="128" y="610" font-weight="600" fill="#1f2328" text-anchor="middle">Discovery</text><text x="128" y="630" font-weight="600" fill="#1f2328" text-anchor="middle">agent</text><rect x="216" y="582" width="148" height="64" rx="9" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-width="1.75"></rect><text x="290" y="606" font-weight="600" fill="#1f2328" text-anchor="middle">Local operator</text><text x="290" y="624" font-size="13.225" fill="#5b6672" text-anchor="middle">telemetry extractors</text><text x="290" y="639" font-size="13.225" fill="#5b6672" text-anchor="middle">+ OTel collector</text><path d="M32 614H64" fill="none" stroke="#c2410c" stroke-width="1.75" marker-end="url(#obsplanes-arrow-accent)" marker-start="url(#obsplanes-arrow-accent)"></path><path d="M364 614H452" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#obsplanes-arrow)"></path></g><path d="M48 142H32V614" fill="none" stroke="#c2410c" stroke-width="1.75"></path><rect x="452" y="352" width="104" height="84" rx="9" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="1.75"></rect><text x="504" y="388" font-weight="600" fill="#1f2328" text-anchor="middle">Regional</text><text x="504" y="408" font-weight="600" fill="#1f2328" text-anchor="middle">operator</text><rect x="452" y="568" width="104" height="84" rx="9" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="1.75"></rect><text x="504" y="604" font-weight="600" fill="#1f2328" text-anchor="middle">Regional</text><text x="504" y="624" font-weight="600" fill="#1f2328" text-anchor="middle">operator</text><rect x="620" y="256" width="300" height="420" rx="10" fill="#047857" fill-opacity="0.06" stroke="#047857" stroke-width="1.5"></rect><text x="640" y="282" font-weight="600" fill="#1f2328">FUSION Platform</text><rect x="636" y="418" width="112" height="94" rx="9" fill="#047857" fill-opacity="0.14" stroke="#047857" stroke-width="1.75"></rect