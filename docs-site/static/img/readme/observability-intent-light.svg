3eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.25"></rect><text x="83" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Cloud</text></g><rect x="236" y="218" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="260" y="218" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="284" y="218" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="52" y="244" width="104" height="58" rx="8" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5"></rect><text x="104" y="270" font-weight="600" fill="#1f2328" text-anchor="middle">Discovery</text><text x="104" y="288" font-weight="600" fill="#1f2328" text-anchor="middle">agent</text><rect x="168" y="244" width="128" height="58" rx="8" fill="#047857" fill-opacity="0.08" stroke="#047857" stroke-width="1.5"></rect><text x="232" y="264" font-weight="600" fill="#1f2328" text-anchor="middle">Local operator</text><text x="232" y="281" font-size="11.5" fill="#5b6672" text-anchor="middle">telemetry extractors</text><text x="232" y="295" font-size="11.5" fill="#5b6672" text-anchor="middle">+ OTel collector</text><path d="M32 273H52" fill="none" stroke="#c2410c" stroke-width="1.75" marker-end="url(#obsplanes-arrow-accent)" marker-start="url(#obsplanes-arrow-accent)"></path><path d="M296 273H312V312H328" fill="none" stroke="#6b7682" stroke-width="1.25" marker-end="url(#obsplanes-arrow)"></path></g><g><rect x="40" y="322" width="268" height="108" rx="10" fill="#047857" fill-opacity="0.06" stroke="#047857" stroke-width="1.5"></rect><g><rect x="52" y="332" width="56" height="20" rx="10" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="1.25"></rect><text x="80" y="346" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Edge</text></g><rect x="236" y="334" width="16" height="16" rx="3" fill="#a16207" fill-opacity="0.85"></rect><rect x="260" y="334" width="16" height="16" rx="