<svg viewBox="0 0 760 604" role="img" aria-label="Ikhnos has a control plane and a data plane. In the control plane, the server holds the observability intent, which says what to observe, where and how well, and the topology and history. The intent goes down to a discovery agent in each cloud, edge and far-edge cluster, and the topology comes back up. In the data plane, each cluster has a local operator with telemetry extractors and an OpenTelemetry collector. Telemetry goes through regional operators to FUSION&#x27;s central operator, then into Prometheus for metrics, Loki for logs and Tempo for traces. FUSION also holds the topology graph in Neo4j, and a shared API gives models, tools and people the fused data." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="obsplanes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7682"></path></marker><marker id="obsplanes-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Inside Ikhnos: control plane and data plane</text><text x="24" y="48" font-size="11.5" fill="#5b6672">The observability intent goes down to the agents. Telemetry goes up to FUSION.</text><rect x="24" y="60" width="712" height="96" rx="14" fill="#2563eb" fill-opacity="0.055" stroke="#2563eb" stroke-opacity="0.35"></rect><text x="40" y="80" font-size="11.5" font-weight="600" fill="#2563eb">CONTROL PLANE · IKHNOS SERVER</text><g><rect x="40" y="92" width="380" height="52" rx="10" fill="#2563eb" fill-opacity="0.14" stroke="#c2410c" stroke-width="2"></rect><circle cx="65" cy="117" r="15" fill="#2563eb" fill-opacity="0.16"></circle><g transform="translate(65 117)"><path d="M-6.5 -9.5H2L7 