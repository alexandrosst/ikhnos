<svg viewBox="0 0 1088 740" role="img" aria-label="Ikhnos has a control plane and a data plane. In the control plane, the server holds the observability intent, which covers discovery and the observability posture, and the topology and history. The intent goes down to a discovery agent in each cloud, edge and far-edge cluster, and the topology comes back up. In the data plane, each cluster has a local operator with telemetry extractors feeding an OpenTelemetry collector. Telemetry goes through regional operators to FUSION&#x27;s central operator, then into Prometheus for metrics, Loki for logs and Tempo for traces. FUSION also holds the topology graph in Neo4j, and a shared API gives outside consumers, models, tools and people, the fused data." font-size="15.6" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="obsplanes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7682"></path></marker><marker id="obsplanes-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker><marker id="obsplanes-arrow-accent-sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"></path></marker></defs><text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">Inside Ikhnos: control plane and data plane</text><text x="24" y="57.599999999999994" font-size="13.799999999999999" fill="#5b6672">The observability intent goes down to the agents. Telemetry goes up to FUSION.</text><rect x="24" y="72" width="1040" height="108" rx="14" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-opacity="0.3"></rect><text x="48" y="98" font-size="13.799999999999999" font-weight="600" fill="#2563eb">CONTROL PLANE · IKHNOS SERVER</text><g><rect x="48" y="112" width="312" height="52" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#c2410c" stroke-opacity="1" stroke-width="1.75"></rect><circle cx="70" cy="138" r="13" fill="#2563eb" fill-opacity="0.16"></circle><g transform="translate(70 138)"><path d="M-6.5 -9.5H2L7 -4.5V9.5H-6.5Z" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2 -9.5V-4.5H7M-3 0H3.5M-3 3.5H3.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="92" y="133.5" font-weight="600" fill="#1f2328">Observability intent</text><text x="92" y="150.5" font-size="13.799999999999999" fill="#5b6672">discovery · observability posture</text></g><g><rect x="708" y="112" width="248" height="52" rx="10" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-opacity="0.85" stroke-width="1.25"></rect><circle cx="730" cy="138" r="13" fill="#2563eb" fill-opacity="0.16"></circle><g transform="translate(730 138)"><rect x="-8" y="-9" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="-8" y="-2.75" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="-8" y="3.5" width="16" height="5.5" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></rect><path d="M-4.5 -6.2h.01M-4.5 0h.01M-4.5 6.2h.01" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="752" y="133.5" font-weight="600" fill="#1f2328">Topology &amp; history</text><text x="752" y="150.5" font-size="13.799999999999999" fill="#5b6672">what ran where, and when</text></g><rect x="24" y="200" width="1040" height="492" rx="14" fill="#047857" fill-opacity="0.045" stroke="#047857" stroke-opacity="0.3"></rect><text x="48" y="228"