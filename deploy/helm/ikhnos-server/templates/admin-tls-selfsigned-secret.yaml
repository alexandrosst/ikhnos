{{- if include "ikhnos.adminSelfSigned" . }}
{{- /*
  Generated once and kept: on upgrade the certificate already in the cluster is reused (lookup), so a browser that was
  already told to trust it doesn't have to do that again on every helm upgrade - the same "generate once, keep" policy
  as pki's CA-key passphrase and neo4j.auth's generated password. The one exception: when the names it must carry change
  (admin.tls.selfSignedHosts, admin.publicURL or agent.publicAddress), the certificate is made again, because a certificate
  that does not name the address you reach the server by is useless. The Secret records the names it was made for in the
  annotation ikhnos.io/admin-tls-hosts, and a Secret from before that annotation counts as made for no extra names.
  `lookup` returns nothing under `helm template` (Argo
  CD, Flux with helm template, --dry-run=client), so in those flows a fresh self-signed certificate is rendered on
  every run: give admin.tls.secretName a real Secret you manage if that matters to you (a GitOps pipeline, say).

  This is a fallback for a trial or a LAN-reachable install, not a substitute for a real certificate: every browser
  shows a "not private" warning until you click through it once, and it only covers the hostnames/IPs baked in below
  (localhost, 127.0.0.1, ::1, the host of admin.publicURL and of agent.publicAddress, plus admin.tls.selfSignedHosts) -
  anything else you reach it by needs to be added to selfSignedHosts, or the browser also complains about a hostname mismatch. For a real, browser-trusted certificate on a public domain,
  use httproute with cert-manager instead; this generated one never gets you that.
*/ -}}
{{- $name := include "ikhnos.adminSelfSignedSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $extra := include "ikhnos.adminSelfSignedHosts" . | fromJsonArray }}
{{- $wanted := join "," $extra }}
{{- $ips := list "127.0.0.1" "::1" }}
{{- $dns := list "localhost" }}
{{- range $extra }}
{{- if or (regexMatch "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$" .) (contains ":" .) }}
{{- $ips = append $ips . }}
{{- else }}
{{- $dns = append $dns . }}
{{- end }}
{{- end }}
{{- $cert := "" }}
{{- $key := "" }}
{{- $madeFor := "" }}
{{- if and $existing $existing.metadata $existing.metadata.annotations }}{{ $madeFor = index $existing.metadata.annotations "ikhnos.io/admin-tls-hosts" | default "" }}{{ end }}
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") (eq $madeFor $wanted) }}
{{- $cert = index $existing.data "tls.crt" | b64dec }}
{{- $key = index $existing.data "tls.key" | b64dec }}
{{- else }}
{{- $generated := genSelfSignedCert (include "ikhnos.fullname" .) $ips $dns 825 }}
{{- $cert = $generated.Cert }}
{{- $key = $generated.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ikhnos.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # The names beyond localhost this certificate was made for: a different list at the next upgrade makes a new one.
    ikhnos.io/admin-tls-hosts: {{ $wanted | quote }}
    # Kept on uninstall so a reinstall (same release name, same volume) doesn't force every browser to click through
    # the self-signed warning again. Delete it by hand if you want a fresh certificate.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
{{- end }}
