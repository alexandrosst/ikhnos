{{- if include "ikhnos.sealingGenerated" . }}
{{- /*
  The key that seals the second-factor secrets, the mail password and the decider secret in the database: made once, by the chart, so
  that a new install needs nothing made by hand first. It is a Secret of its own, so it is not on the data volume and not in a backup of
  it, which is the point of sealing. The same "generate once, keep" policy as the Neo4j password and the admin certificate:

  - On upgrade the key already in the cluster is reused (lookup), so it never changes by itself.
  - It is kept when the release is removed (helm.sh/resource-policy: keep). The database stays on its volume, and a reinstall that
    reuses the volume needs the same key, which it finds and takes over.
  - A Secret of that name that another release made, or that you made, is left alone and used as it is.

  `lookup` returns nothing under `helm template` (Argo CD, Flux with helm template, --dry-run=client), so in those flows a new random
  key would be rendered on every run, and that would replace the key at every sync. If you install that way, make the Secret yourself
  and name it in sealing.keySecret.name. Keep a copy of the key apart from the cluster: NOTES.txt says how to read it.
*/ -}}
{{- $name := include "ikhnos.sealingSecretName" . }}
{{- $key := include "ikhnos.sealingSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $mine := true }}
{{- if $existing }}
{{- $note := $existing.metadata.annotations | default dict }}
{{- if ne (index $note "meta.helm.sh/release-name" | default "") .Release.Name }}{{- $mine = false }}{{- end }}
{{- end }}
{{- if $mine }}
{{- $value := randAlphaNum 64 }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ikhnos.labels" . | nindent 4 }}
    app.kubernetes.io/component: sealing
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
