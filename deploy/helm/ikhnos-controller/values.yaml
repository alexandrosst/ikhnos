# Optional. The Connect a cluster page's `helm install` is the way to add an agent; this controller is for people who want a resource
# in the cluster to be that way. It watches the IkhnosAgent resources of ITS OWN namespace and installs the agent there.

image:
  # A placeholder, like the other charts': a release build bakes in the registry it published to.
  repository: ikhnos/controller
  tag: ""        # empty -> the chart's appVersion
  digest: ""     # sha256:..., wins over the tag
  pullPolicy: "" # empty -> Always for the moving edge tag, IfNotPresent otherwise
imagePullSecrets: []

# The agent images the controller installs. The agent chart it carries is the source tree's, whose image names are placeholders; a
# release build bakes the registry it published to in here (the published agent chart has it baked in the same way). An IkhnosAgent
# can still name its own image (spec.image).
agent:
  image:
    repository: ikhnos/ikhnos
    tag: ""      # empty -> the agent chart's appVersion, which is this controller's own version
  linkImage:
    repository: ikhnos/link

# The highest access tier (0, 1 or 2) an IkhnosAgent may ask for, and the most this chart gives the controller permission for.
#
# Kubernetes lets nobody create a ClusterRole that grants what they do not hold themselves. To install an agent at tier 2 the
# controller therefore holds, cluster-wide, everything tier 2 reads (pods, services, workloads, ingresses, ...), and at tier 1 what
# tier 1 reads (nodes and classes). Set this to the tier you will use and the controller holds no more: 0 holds one namespace's name.
# An IkhnosAgent that asks for a tier above it is refused with a message, not trimmed.
maxAccessTier: 2

# Whether an IkhnosAgent may turn telemetry on (spec.telemetry). It is off because the agent's telemetry collectors need cluster-wide reads
# the access tier does not give (the pods, nodes, workloads and events they watch), and the same rule applies: the controller can only
# create the agent's ClusterRole for them if it holds what the role grants. On, the controller holds those reads and may also create the
# ConfigMaps and NetworkPolicies the telemetry makes; off, an IkhnosAgent that turns a signal on is refused with a message, not trimmed.
# Before turning this off again, remove spec.telemetry from the resource and let the controller upgrade the agent: it needs the
# permissions to take the telemetry's objects away.
allowTelemetry: false

# How long one install, upgrade or uninstall (with its hooks) may take.
timeout: 5m

resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Ask for the agent in the same command that installs the controller, so that one `helm install` is all there is to run. The Connect
# page fills these in. With a server address set, the chart writes the one-time token into the Secret the resource names, writes the
# resource's spec into a ConfigMap, and the controller makes the IkhnosAgent from it, once. After that the resource is yours: edit it,
# patch it, delete it. Running the command again with other values changes the fields it states and leaves the rest (the telemetry you
# set since, say). Leave `server` empty to ask for the agent yourself with `kubectl apply` (see the notes the install prints).
bootstrap:
  server: ""        # host:port of the server's agent listener
  caPin: ""         # sha256/... : the pin of the server's CA, from the Connect page
  token: ""         # the one-time enrollment token (a Secret named ikhnos-enrollment holds it; it can be deleted once the agent has enrolled)
  accessTier: null  # the tier to install at; empty: maxAccessTier
  collectors: {}    # nodeProbe, flowObserver, measurements: true
  scope: {}         # namespaces, exclude (lists), selector (a label selector)
  purgeIdentityOnDelete: false
  image: {}         # repository, tag, digest of the agent image, when not this controller's own defaults
